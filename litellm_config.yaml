# LiteLLM Proxy Configuration — PS5: Honest Filing Analyst
# 20 RPM hard rate limit, PostgreSQL token audit logging, Groq -> OpenRouter failover
# Reference: RFC-PS5-2026-001, Section 3.5

model_list:
  # Primary LLM: Groq Llama-3.3-70B (free tier, fast inference)
  - model_name: filing-analyst-llm
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 20
      timeout: 3.2
      max_retries: 0
      max_tokens: 250  # Hard cap per PS5 token budget (stretch: <=80k total / 40 questions)

  # Fallback LLM: OpenRouter (free Llama-3.3-70B) — activates on Groq 429/503
  - model_name: filing-analyst-llm-fallback
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      timeout: 3.8
      max_retries: 0
      max_tokens: 250

  # Secondary fallback: Google Gemini Flash (free tier)
  - model_name: filing-analyst-llm-fallback-2
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 15
      timeout: 4.0
      max_retries: 0
      max_tokens: 250

litellm_settings:
  drop_params: true
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  num_retries: 1
  fallbacks:
    - filing-analyst-llm:
        - filing-analyst-llm-fallback
        - filing-analyst-llm-fallback-2
  rpm_limit: 20
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  model_group_alias:
    filing-analyst-llm: filing-analyst-llm

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  ui_access_mode: "off"
